# The only thing that compiles the project on a pull request. Vercel used to do
# it through preview deployments, which are off now (see `vercel.json`), and a
# dependency major that breaks the build should fail here rather than on `main`.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Reads the code and nothing else. Without this the token gets whatever the
# repository default is, which may be write access to everything.
permissions:
  contents: read

# A new push to a pull request makes the run for the previous one moot, so it
# is cancelled rather than left to finish. Runs on `main` are never cancelled:
# each one is the record of what got merged.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest

    # `next build` prerenders `/[lang]`, and the components on that page read
    # the database through Prisma, so the build needs a reachable Postgres.
    # This one is created and thrown away with the job — the credentials below
    # are not secrets and never leave the runner.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Without a health check the steps can start before Postgres accepts
        # connections, and the build fails for a reason that has nothing to do
        # with the change under review.
        #
        # `-U postgres` is not optional: the check runs inside the container as
        # root, and `pg_isready` defaults to the operating system user as the
        # database role, so it asks for a `root` role that does not exist.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # Better Auth reads these on its own and refuses to start without a
      # secret. This one only ever signs cookies nobody reads.
      BETTER_AUTH_SECRET: throwaway-secret-for-ci
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # `postinstall` runs `prisma generate`, so the client under
      # `generated/prisma` exists from here on.
      - run: npm ci

      # The schema has to exist before the build queries it.
      - name: Apply migrations
        run: npx prisma migrate deploy

      # The database now has exactly what the migrations build. If
      # `schema.prisma` describes anything else, a change to it was committed
      # without the migration that goes with it — which `migrate deploy` in
      # production would never apply. `--exit-code` turns a non-empty diff into
      # a failure.
      - name: Check the schema matches the migrations
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - run: npm run lint

      # The Husky + lint-staged hook already formats what it sees, but it only
      # sees commits made from a checkout that ran `npm install`. It misses an
      # edit through the GitHub web editor, a `--no-verify` commit, and a
      # conflict resolved by hand. This is the check that covers those.
      - run: npm run format:check

      # `LayoutProps`, `PageProps` and `RouteContext` are global types Next.js
      # writes into `.next/types`, and `tsconfig.json` includes that directory.
      # A fresh checkout has no `.next`, so `tsc` would fail on those names
      # alone. Locally it passes because `next dev` already generated them.
      - name: Generate route types
        run: npx next typegen

      # `next build` reports type errors too, but this runs first because it
      # fails in seconds rather than minutes.
      - name: Type-check
        run: npx tsc --noEmit

      # Unit tests for the pure functions — URL normalisation, locale matching,
      # dictionary parity. No database or browser involved, so they run in
      # seconds and go before the build for the same reason the type check does.
      - run: npm test

      - run: npm run build
